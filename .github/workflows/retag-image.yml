name: Retag existing image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable image tag
        required: true
      target_tag:
        description: New semantic version tag
        required: true

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy manifest to semantic tag
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/barryturner/known-in-song-acestep-worker:${{ inputs.target_tag }}
          ghcr.io/barryturner/known-in-song-acestep-worker:${{ inputs.source_tag }}
